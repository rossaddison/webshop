name: webshop build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  test:
    name: PHP ${{ matrix.php }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # A single PHP version to start with (composer.json actually
        # supports 8.3-8.5) — this is a young, small repo; widen the
        # matrix once there's more surface area worth the extra CI time.
        # ubuntu + windows both kept since local development happens on
        # Windows.
        include:
          - os: ubuntu-latest
            php: '8.4'
          - os: windows-latest
            php: '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: apcu, ctype, curl, fileinfo, filter, intl, json, mbstring, openssl
          tools: composer:v2
          coverage: none

      - name: Set up Composer GitHub auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: composer config --global --auth github-oauth.github.com "$GITHUB_TOKEN"

      - name: Determine composer cache directory on Linux
        if: matrix.os == 'ubuntu-latest'
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> $GITHUB_ENV

      - name: Determine composer cache directory on Windows
        if: matrix.os == 'windows-latest'
        run: echo "COMPOSER_CACHE_DIR=~\AppData\Local\Composer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache dependencies installed with composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: php${{ matrix.php }}-${{ matrix.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            php${{ matrix.php }}-${{ matrix.os }}-composer-

      # composer.lock is committed — install for a reproducible build
      # rather than update.
      - name: Install dependencies with composer
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --ansi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # Publishes Bootstrap's own dist files locally (see
      # Yiisoft\Bootstrap5\Assets\BootstrapAsset in the main layout) —
      # this repo has no TypeScript build step of its own yet, so this is
      # only ever an install, never a compile.
      - name: Install dependencies with npm
        run: npm ci --ignore-scripts

      - name: Unit tests (Testo)
        run: vendor/bin/testo --suite=Unit
