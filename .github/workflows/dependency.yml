name: webshop dependency checker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  require-checker:
    name: PHP ${{ matrix.php }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # composer.json spans 8.3-8.5; same "newest couple of versions,
        # not the whole range" reasoning as ci.yml's own matrix note. No
        # Alpine leg either, unlike invoice's own invoice_dependency.yml —
        # that exists there because invoice itself targets an Alpine
        # deployment; webshop doesn't yet.
        include:
          - os: ubuntu-latest
            php: '8.4'
          - os: ubuntu-latest
            php: '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: apcu, ctype, curl, fileinfo, filter, intl, json, mbstring, openssl
          tools: composer:v2
          coverage: none

      - name: Set up Composer GitHub auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: composer config --global --auth github-oauth.github.com "$GITHUB_TOKEN"

      - name: Determine composer cache directory
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> $GITHUB_ENV

      - name: Cache dependencies installed with composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            php${{ matrix.php }}-composer-

      - name: Update composer
        run: composer self-update

      # composer install (not just require) first, matching this repo's
      # own composer.lock — then composer-require-checker is added on top
      # as a throwaway CI-only dev dependency, same as invoice_dependency.yml
      # never commits it to composer.json either.
      - name: Install dependencies with composer
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --ansi

      - name: Install maglnet/composer-require-checker
        run: composer require --dev maglnet/composer-require-checker:^4.19 --no-interaction --no-progress --ansi

      - name: Check dependencies
        run: vendor/bin/composer-require-checker
