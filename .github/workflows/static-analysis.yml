name: webshop static analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  psalm:
    name: PHP ${{ matrix.php }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # composer.json spans 8.3-8.5; same "newest couple of versions,
        # not the whole range" reasoning as ci.yml's own matrix note.
        include:
          - os: ubuntu-latest
            php: '8.4'
          - os: ubuntu-latest
            php: '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: apcu, ctype, curl, fileinfo, filter, intl, json, mbstring, openssl
          tools: composer:v2, cs2pr
          coverage: none

      - name: Set up Composer GitHub auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: composer config --global --auth github-oauth.github.com "$GITHUB_TOKEN"

      - name: Determine composer cache directory
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> $GITHUB_ENV

      - name: Cache dependencies installed with composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            php${{ matrix.php }}-composer-

      # composer.lock is committed — install for a reproducible build
      # rather than update.
      - name: Install dependencies with composer
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --ansi

      # Psalm itself has no --ansi flag (unlike Composer above) — confirmed
      # live after the first version of this workflow failed with
      # "Unrecognised argument --ansi". cs2pr still gets checkstyle output
      # for PR annotations regardless of that flag.
      - name: Static analysis
        run: vendor/bin/psalm --stats --output-format=checkstyle | cs2pr --graceful-warnings --colorize
